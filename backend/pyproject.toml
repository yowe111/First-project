[project]
# Имя пакета (проекта). Используется только внутри Poetry.
name = "my-api"
version = "0.2.0"
description = "Учебное FastAPI-приложение: Hello World, авторизация, роли, Alembic"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",   # нужен для типа EmailStr
    "bcrypt (>=4.2.0,<5.0.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
    "python-multipart (>=0.0.12,<1.0.0)",
    "alembic (>=1.13.0,<2.0.0)",          # миграции схемы базы
    "greenlet (>=3.0.0,<4.0.0)",          # нужен SQLAlchemy async
    "pytest (>=8.3.0,<9.0.0)",            # тесты (учебный проект — ставим вместе)
    "pytest-asyncio (>=0.24.0,<1.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "aiosqlite (>=0.20.0,<1.0.0)",        # SQLite для тестов, без Docker
]

# Зависимости аналитического ядра вынесены отдельно: в контейнер API они
# не нужны и только раздували бы образ. Ставятся командой
#   poetry install --extras analytics
[project.optional-dependencies]
analytics = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scipy (>=1.13,<2.0)",          # оптимизация для BG/NBD и Gamma-Gamma
    "pyarrow (>=16.0,<22.0)",       # быстрый parquet вместо CSV
    "openpyxl (>=3.1,<4.0)",        # чтение .xlsx от пользователей
    "lightgbm (>=4.7.0,<5.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "shap (>=0.53.0,<0.54.0)",
    
]
notebooks = [
    "jupyterlab (>=4.2,<5.0)",
    "ipykernel (>=6.29,<7.0)",
    "matplotlib (>=3.9,<4.0)",
    "seaborn (>=0.13,<1.0)",
    
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
